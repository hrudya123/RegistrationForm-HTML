<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h2>Registration Form</h2>
    <form action="">
        <label for="firstname">FirstName:</label>
        <input type="text" name="firstname" id="firstname" placeholder="Enter first name" required minlength="2"><br>
        <label for="lastname">LastName:</label>
        <input type="text" name="lastname" id="lastname" placeholder="Enter last name" required><br>
        <label for="dob">Date of birth:</label>
        <input type="date" name="dob" id="dob" required><br>
        <label for="">Gender:</label>
        <input type="radio" name="gender" id="male" value="Male" required>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="Female" required>
        <label for="female">Female</label>
        <input type="radio" name="gender" id="other" value="Other" required>
        <label for="other"> Other</label><br>
        <label for="qualification">Qualification:</label>
        <select name="qualification" id="qualification" required>
            <option value="SSLC">SSLC</option>
            <option value="Plus Two">Plus Two</option>
            <option value="Graduate">Graduate</option>
            <option value="Post Graduate">Post Graduate</option>
        </select><br>
        <label for="address">Address:</label>
        <textarea name="address" id="address" rows="4" cols="30" placeholder="Enter your address" required minlength="10"></textarea><br>
        <label for="state">State:</label>
        <select name="state" id="state" required>
            <option value="Kerala">Kerala</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Maharashtra">Maharashtra</option>
            </select><br>
            <label for="pincode">Pincode:</label>
            <input type="text" name="pincode" id="pincode" placeholder="Enter 6 digit pincode" pattern="[0-9]{6}" maxlength="6" required><br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="example@gmail.com" required><br>
            <label for="phone">Phone:</label>
            <input type="text" name="phone" id="phone" placeholder="enter 10 digit phone number" pattern="[0-9]{10}" maxlength="10" required><br>
            <label for="username">Username:</label>
            <input type="text" name="username" id="username" placeholder="Enter username" minlength="4" maxlength="30" required><br>
            <label for="password">Password:</label>
            <input type="password" name="password" id="password" placeholder="Enter password" minlength="8" required><br>
            <input type="submit" name="" id="" value="Register">
            <input type="reset" value="Clear">

        </form>
</body>
</html>
